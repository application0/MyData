    body {

      color: var(--text-dark);
      overflow: hidden;
      position: fixed;
      width: 100vw;
      height: 100vh;
      touch-action: pan-y;

    /* Main Container */
    .video-container {

    .video-slide {

      justify-content: center;
      background: var(--bg-dark);

      justify-content: center;

    .fullscreen-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: var(--bg-dark);
      border: none;
    }

    .fullscreen-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      background: var(--bg-dark);

    /* Landscape video handling */

      height: auto !important;

    /* Skip First 5 Seconds Overlay */

    .swipe-dot.active {

    /* Responsive Design */
    @media (max-width: 768px) {
      .banner-728x90 {

      .comments-overlay {

      .comments-list {

    /* Animations */
    @keyframes pulse {
      0%, 100% { opacity: 1; }

    @keyframes spin {

    @keyframes slideInComment {
      from {

        transform: translateX(-20px);

      to {

        transform: translateX(0);

    /* Hide elements during video load */
    .video-hidden {

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      initializeApp();
      setupTouchHandlers();
      setupKeyboardHandlers();
      loadComments();
      startCommentAnimation();
    });

    // Disable right-click and dev tools
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if (e.keyCode == 123 || 
          (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) ||
          (e.ctrlKey && e.keyCode == 85) ||
          (e.ctrlKey && e.keyCode == 83)) {
        e.preventDefault();
        return false;
      }
    });

    // Initialize App
    async function initializeApp() {
      try {
        // Load video URLs
        const response = await fetch('https://raw.githubusercontent.com/application0/MyData/refs/heads/main/FindVideoInURLs');
        const text = await response.text();
        allUrls = text.split(/\r?\n/).filter(url => url.trim() && /^https?:\/\//.test(url.trim()));
        
        if (allUrls.length === 0) {
          allUrls = ['https://x-world.blogspot.com']; // Fallback
        }

        // Shuffle URLs
        shuffleArray(allUrls);
        
        // Create video slides
        createVideoSlides();
        
        // Load first video
        await loadVideo(0);

	  function setupVideoPlayer(index, videoUrl) {
        const videoElement = document.getElementById(`video${index}`);
        
        // Check if the URL is an HLS stream (.m3u8)
        if (videoUrl.includes('.m3u8')) {
            if (Hls.isSupported()) {
                console.log("HLS.js is supported. Playing m3u8 stream.");
                const hls = new Hls();
                hls.loadSource(videoUrl);
                hls.attachMedia(videoElement);
                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    videoElement.play().catch(e => console.log('Autoplay for HLS failed:', e));
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (like on Safari)
                console.log("Native HLS support found.");
                videoElement.src = videoUrl;
                videoElement.addEventListener('loadedmetadata', function () {
                    videoElement.play().catch(e => console.log('Autoplay for native HLS failed:', e));
                });
            } else {
                 console.error("HLS is not supported on this browser.");
            }
        } else {
            // It's a normal video format like MP4
            console.log("Playing standard MP4 video.");
            videoElement.src = videoUrl;
            videoElement.play().catch(e => console.log('Autoplay for MP4 failed:', e));
        }

        // Add landscape class if needed
        videoElement.addEventListener('loadedmetadata', () => {
          if (videoElement.videoWidth > videoElement.videoHeight) {
            videoElement.classList.add('landscape-video');
          }
        });
    }

    // Setup 5-second skip
    function setupVideoSkip(index) {
      const skipOverlay = document.getElementById(`skipOverlay${index}`);
      const skipTimer = document.getElementById(`skipTimer${index}`);
      const skipCount = document.getElementById(`skipCount${index}`);
      const video = document.getElementById(`video${index}`);
      
      let countdown = 5;
      
      const timer = setInterval(() => {
        countdown--;
        skipTimer.textContent = countdown;
        skipCount.textContent = countdown;
        
        if (countdown <= 0) {
          clearInterval(timer);
          skipOverlay.style.display = 'none';
          
          // Start video if it's a video element
          if (video && video.tagName === 'VIDEO') {
            video.play().catch(e => console.log('Autoplay failed:', e));
          }
        }
      }, 1000);
    }

	  async function processVideoUrl(url) {
      try {
        // Strategy 1: Check for direct video URLs, including popular platforms
        if (url.match(/\.(mp4|webm|ogg|m3u8)(\?.*)?$/i)) return { url, type: 'direct' };
        const youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
        if (youtubeMatch) return { url: `https://www.youtube.com/embed/${youtubeMatch[1]}?autoplay=1&rel=0`, type: 'embed' };
        const vimeoMatch = url.match(/vimeo\.com\/(\d+)/);
        if (vimeoMatch) return { url: `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1`, type: 'embed' };

        // Strategy 2: Fetch the page content using a proxy and parse it
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error(`Proxy fetch failed for ${url}`);
        const data = await response.json();
        const html = data.contents;
        if (!html) throw new Error(`Empty HTML content for ${url}`);

        // Strategy 2.1: Find video links using Regex (from simple to complex)
        let videoUrlMatch;
        // High-quality mp4 source
        videoUrlMatch = html.match(/"(https?:\/\/[^"]+\.mp4[^"]*)"/i);
        if(videoUrlMatch) {
            console.log("SUCCESS: Found MP4 link via direct URL match.");
            return { url: videoUrlMatch[1], type: 'direct' };
        }
        // m3u8 (HLS Stream) link
        videoUrlMatch = html.match(/"(https?:\/\/[^"]+\.m3u8[^"]*)"/i);
        if (videoUrlMatch) {
            console.log("SUCCESS: Found M3U8 link.");
            return { url: videoUrlMatch[1], type: 'direct' };
        }
        // Check inside <video> tag
        videoUrlMatch = html.match(/<video[^>]+src="([^"]+)"/i);
        if (videoUrlMatch) {
            console.log("SUCCESS: Found video link in <video> tag.");
            return { url: new URL(videoUrlMatch[1], url).href, type: 'direct' };
        }
        // Check inside <source> tag
        videoUrlMatch = html.match(/<source[^>]+src="([^"]+)"/i);
         if (videoUrlMatch) {
            console.log("SUCCESS: Found video link in <source> tag.");
            return { url: new URL(videoUrlMatch[1], url).href, type: 'direct' };
        }

        // Strategy 3: If nothing found, fallback to iframe
        console.warn('FALLBACK: No direct video link found. Using iframe for:', url);
        return { url, type: 'iframe' };

      } catch (error) {
        console.error('URL processing critical error:', error);
        console.warn('CRITICAL FALLBACK: Using iframe due to an error for:', url);
        return { url, type: 'iframe' }; // Fallback to iframe on any error
      }
    }

    // Touch Handlers for Swipe
    function setupTouchHandlers() {
      const container = document.getElementById('videoContainer');
		
      container.addEventListener('click', showControls, true);
		
      container.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;

		  const currentIframe = document.querySelector(`#video${currentVideoIndex}.fullscreen-iframe`);
        if (currentIframe) {
            currentIframe.style.pointerEvents = 'none';
        }
        showControls();
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
       // e.preventDefault(); // Prevent page scroll
      }, { passive: false });

      container.addEventListener('touchend', (e) => {
        touchEndY = e.changedTouches[0].clientY;
        handleSwipe();

		  const currentIframe = document.querySelector(`#video${currentVideoIndex}.fullscreen-iframe`);
        if (currentIframe) {
            currentIframe.style.pointerEvents = 'auto';
        }
      }, { passive: true });
    }

	  function showControls() {
        const controlsWrapper = document.querySelector('.controls-wrapper');
        if (controlsWrapper) {
            controlsWrapper.classList.remove('hidden');
        }

        // Clear any existing timer
        if (controlsHideTimer) {
            clearTimeout(controlsHideTimer);
        }

        // Set a new timer to hide controls after 5 seconds
        controlsHideTimer = setTimeout(() => {
            hideControls();
        }, 5000);
    }

    // Function to hide the controls
    function hideControls() {
        const controlsWrapper = document.querySelector('.controls-wrapper');
        if (controlsWrapper) {
            controlsWrapper.classList.add('hidden');
        }
    }
    

    // Handle swipe gesture
    function handleSwipe() {
      const swipeThreshold = 50;
      const swipeDistance = touchStartY - touchEndY;

      if (Math.abs(swipeDistance) > swipeThreshold) {
        if (swipeDistance > 0) {
          // Swipe up - next video
          nextVideo();
        } else {
          // Swipe down - previous video
          previousVideo();
        }
      }
    }

    // Keyboard handlers
    function setupKeyboardHandlers() {
      document.addEventListener('keydown', (e) => {
        switch(e.key) {
          case 'ArrowUp':
            e.preventDefault();
            previousVideo();
            break;
          case 'ArrowDown':
            e.preventDefault();
            nextVideo();
            break;
          case ' ':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'c':
          case 'C':
            toggleComments();
            break;
        }
      });
    }

    // Navigation functions
    function nextVideo() {
      if (currentVideoIndex < allUrls.length - 1) {
        currentVideoIndex++;
        switchToVideo(currentVideoIndex);
        preloadNextVideos();
      }
    }

    function previousVideo() {
      if (currentVideoIndex > 0) {
        currentVideoIndex--;
        switchToVideo(currentVideoIndex);
      }
    }

    function switchToVideo(index) {
      const slider = document.getElementById('videoSlider');
      const dots = document.querySelectorAll('.swipe-dot');
      
      // Update slider position
      slider.style.transform = `translateY(-${index * 100}vh)`;
      
      // Update indicators
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
      
      // Load video if not loaded
      if (!document.getElementById(`video${index}`)) {
        loadVideo(index);
      }
    }

    // Preload next videos
    function preloadNextVideos() {
      const preloadCount = 2;
      for (let i = 1; i <= preloadCount; i++) {
        const nextIndex = currentVideoIndex + i;
        if (nextIndex < allUrls.length && !document.getElementById(`video${nextIndex}`)) {
          setTimeout(() => loadVideo(nextIndex), i * 1000);
        }
      }
    }

    // Comments functions
    function loadComments() {
      // Try to load from comments.json, fallback to sample comments
      fetch('comments.json')
        .then(response => response.json())
        .then(data => {
          comments = data;
          displayComments();
        })
        .catch(() => {
          comments = sampleComments;
          displayComments();
        });
    }

    function displayComments() {
      const commentsList = document.getElementById('commentsList');
      commentsList.innerHTML = '';

      comments.forEach(comment => {
        const commentElement = document.createElement('div');
        commentElement.className = 'comment-item';
        commentElement.innerHTML = `
          <img src="${comment.avatar}" alt="${comment.name}" class="comment-avatar">
          <div class="comment-content">
            <div class="comment-name">${comment.name}</div>
            <div class="comment-text">${comment.text}</div>
            <div class="comment-time">${getTimeAgo(comment.timestamp)}</div>
          </div>
        `;
        commentsList.appendChild(commentElement);
      });
    }

    function startCommentAnimation() {
      setInterval(() => {
        if (comments.length > 0) {
          addRandomComment();
        }
      }, 5000 + Math.random() * 10000); // Random interval between 5-15 seconds
    }

    function addRandomComment() {
      const randomNames = ['Alex', 'Sarah', 'Mike', 'Emma', 'John', 'Lisa', 'David', 'Anna'];
      const randomTexts = [
        'Amazing video! 🔥',
        'Love this content!',
        'So cool! 😍',
        'More please!',
        'Incredible! 👍',
        'Best video ever!',
        'Can\'t stop watching!',
        'This is awesome!'
      ];

      const newComment = {
        id: Date.now(),
        name: randomNames[Math.floor(Math.random() * randomNames.length)],
        avatar: `https://i.pravatar.cc/40?img=${Math.floor(Math.random() * 70) + 1}`,
        text: randomTexts[Math.floor(Math.random() * randomTexts.length)],
        timestamp: Date.now()
      };

      comments.unshift(newComment);
      if (comments.length > 50) {
        comments.pop(); // Keep only latest 50 comments
      }

      displayComments();
    }

    function toggleComments() {
      const overlay = document.getElementById('commentsOverlay');
      const toggle = document.getElementById('commentsToggle');
      
      overlay.classList.toggle('show');
      commentsVisible = overlay.classList.contains('show');
      
      if (commentsVisible) {
        toggle.style.background = 'var(--accent-color)';
      } else {
        toggle.style.background = 'var(--control-bg)';
      }
    }

    function sendComment() {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      
      if (text) {
        const newComment = {
          id: Date.now(),
          name: 'You',
          avatar: 'https://i.pravatar.cc/40?img=0',
          text: text,
          timestamp: Date.now()
        };
        
        comments.unshift(newComment);
        displayComments();
        input.value = '';
        
        // Scroll to top of comments
        document.getElementById('commentsList').scrollTop = 0;
      }
    }

    // Utility functions
    function getTimeAgo(timestamp) {
      const now = Date.now();
      const diff = now - timestamp;
      const minutes = Math.floor(diff / 60000);
      
      if (minutes < 1) return 'Just now';
      if (minutes === 1) return '1 minute ago';
      if (minutes < 60) return `${minutes} minutes ago`;
      
      const hours = Math.floor(minutes / 60);
      if (hours === 1) return '1 hour ago';
      if (hours < 24) return `${hours} hours ago`;
      
      const days = Math.floor(hours / 24);
      if (days === 1) return '1 day ago';
      return `${days} days ago`;
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function togglePlayPause() {
      const video = document.getElementById(`video${currentVideoIndex}`);
      if (video && video.tagName === 'VIDEO') {
        if (video.paused) {
          video.play();
        } else {
          video.pause();
        }
      }
    }

    // Control functions
    function goHome() {
      window.open('home.html', '_blank');
    }

    function shareVideo() {
      if (navigator.share) {
        navigator.share({
          title: 'Amazing Live Video',
          text: 'Check out this awesome video!',
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        showNotification('Link copied to clipboard!');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // Ad functions
    function closeAd(adId) {
      const ad = document.getElementById(adId);
      if (ad) {
        ad.style.display = 'none';
      }
    }

    // Notification
    function showNotification(message) {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--control-bg);
        color: white;
        padding: 1rem 2rem;
        border-radius: 1rem;
        z-index: 2000;
        backdrop-filter: blur(10px);
        border: 2px solid var(--control-border);
      `;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    // Handle comment input
    document.getElementById('commentInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendComment();
      }
    });

    // Prevent page reload/navigation
    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
    });
  </script>
