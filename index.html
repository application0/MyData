        button.classList.remove('secondary');
      }
      
      localStorage.setItem('autoPlay', autoPlay);
    }
    // Keyboard Shortcuts - Only for navigation buttons
    function initializeKeyboardHandlers() {
      document.addEventListener('keydown', (e) => {
        switch(e.key) {
          case 'ArrowUp':
          case 'ArrowLeft':
            e.preventDefault();
            previousVideo();
            break;
          case 'ArrowDown':
          case 'ArrowRight':
            e.preventDefault();
            nextVideo();
            break;
          case 'r':
          case 'R':
            randomVideo();
            break;
          case 's':
          case 'S':
            shareVideo();
            break;
        }
      });
    }
    // Video Loading and Display - Optimized
    async function loadCurrentVideo() {
      if (isLoading) return;
      
      isLoading = true;
      isVideoLoaded = false;
      
      const currentUrl = allUrls[currentVideoIndex];
      const videoContent = document.getElementById('videoContent');
      const loadingOverlay = document.getElementById('loadingOverlay');
      
      // Show loading overlay
      loadingOverlay.style.display = 'flex';
      updateLoadingText('Loading video...');
      updateProgress(0, 'Initializing...');
      
      try {
        // Check cache first
        const cacheKey = `video_${currentUrl}`;
        if (videoCache.has(cacheKey)) {
          updateProgress(50, 'Loading from cache...');
          const cachedData = videoCache.get(cacheKey);
          displayVideo(cachedData);
          updateProgress(100, 'Ready to play');
        } else {
          updateProgress(25, 'Processing video URL...');
          const videoData = await processVideoUrl(currentUrl);
          
          if (videoData) {
            videoCache.set(cacheKey, videoData);
            displayVideo(videoData);
            updateProgress(100, 'Ready to play');
          } else {
            showError('Failed to load video', 'The video could not be loaded. Please try the next video.');
          }
        }
        
      } catch (err) {
        console.error('Video loading error:', err);
        showError('Loading Error', err.message || 'An unexpected error occurred while loading the video.');
      } finally {
        isLoading = false;
        
        // Hide loading overlay after a brief delay
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
          isVideoLoaded = true;
        }, 800);
      }
    }
    function displayVideo(videoData) {
      const videoContent = document.getElementById('videoContent');
      const domain = extractDomain(videoData.pageUrl);
      const title = videoData.metadata?.title || `Video from ${domain}`;
      
      let videoHTML = '';
      
      if (videoData.thumbnail && !videoData.videoUrl) {
        // Show thumbnail with play button
        videoHTML = `
          <div class="video-thumbnail-display">
            <img src="${videoData.thumbnail}" alt="${title}" class="preview-thumbnail">
            <div class="thumbnail-overlay">
              <div class="large-play-button" onclick="playVideoFromThumbnail('${videoData.pageUrl}')">▶</div>
              <div class="video-title-overlay">
                <div class="video-title-main">${title}</div>
                <div class="video-subtitle">Click to play • ${domain}</div>
              </div>
            </div>
          </div>
        `;
      } else if (videoData.videoUrl) {
        if (videoData.type === 'direct') {
          videoHTML = `
            <video class="fullscreen-video video-transition" controls preload="metadata" 
                   crossorigin="anonymous" controlsList="nodownload" ${autoPlay ? 'autoplay' : ''}>
              <source src="${videoData.videoUrl}" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          `;
        } else if (videoData.type === 'embed') {
          videoHTML = `
            <iframe class="fullscreen-iframe video-transition" 
                    src="${videoData.videoUrl}" 
                    frameborder="0" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen 
                    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
            </iframe>
          `;
        } else {
          videoHTML = `
            <iframe class="fullscreen-iframe video-transition" 
                    src="${videoData.pageUrl}" 
                    frameborder="0" 
                    allowfullscreen 
                    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                    referrerpolicy="no-referrer">
            </iframe>
          `;
        }
      } else {
        // Fallback to iframe
        videoHTML = `
          <iframe class="fullscreen-iframe video-transition" 
                  src="${videoData.pageUrl}" 
                  frameborder="0" 
                  allowfullscreen 
                  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                  referrerpolicy="no-referrer">
          </iframe>
        `;
      }
      
      // Clear previous content and add new
      const loadingOverlay = videoContent.querySelector('.loading-overlay');
      videoContent.innerHTML = '';
      if (loadingOverlay) {
        videoContent.appendChild(loadingOverlay);
      }
      
      // Add new video content
      const newVideoContainer = document.createElement('div');
      newVideoContainer.innerHTML = videoHTML;
      videoContent.appendChild(newVideoContainer);
      
      // Setup video event listeners
      const video = newVideoContainer.querySelector('video');
      if (video) {
        video.addEventListener('ended', () => {
          if (autoPlay && currentVideoIndex < allUrls.length - 1) {
            setTimeout(nextVideo, 1000);
          }
        });
        
        video.addEventListener('error', () => {
          showError('Video Playback Error', 'This video cannot be played. Trying next video...');
          setTimeout(nextVideo, 2000);
        });
      }
    }
    function playVideoFromThumbnail(url) {
      // Try to load the actual video
      loadCurrentVideo();
    }
    // Video Processing - Simplified and Optimized
    async function processVideoUrl(pageUrl) {
      updateProgress(30, 'Extracting video data...');
      
      try {
        // Try special platforms first
        const specialData = await trySpecialPlatforms(pageUrl);
        if (specialData) {
          return specialData;
        }
        
        updateProgress(60, 'Processing with proxy...');
        
        // Try proxy services
        const proxyServices = [
          `https://api.allorigins.win/get?url=${encodeURIComponent(pageUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(pageUrl)}`
        ];
        for (const proxyUrl of proxyServices) {
          try {
            const response = await fetch(proxyUrl);
            if (!response.ok) continue;
            
            let html;
            if (proxyUrl.includes('allorigins')) {
              const data = await response.json();
              html = data.contents;
            } else {
              html = await response.text();
            }
            
            const videoUrl = extractVideoFromHtml(html, pageUrl);
            const thumbnail = await extractThumbnailFromHtml(html, pageUrl);
            const metadata = extractMetadataFromHtml(html);
            
            if (videoUrl) {
              return {
                pageUrl,
                videoUrl,
                thumbnail,
                metadata,
                type: 'direct',
                status: 'Ready'
              };
            } else if (thumbnail) {
              return {
                pageUrl,
                videoUrl: null,
                thumbnail,
                metadata,
                type: 'thumbnail',
                status: 'Thumbnail Only'
              };
            }
            
          } catch (err) {
            console.warn('Proxy failed:', proxyUrl, err);
          }
        }
        
        // Fallback to direct iframe
        return {
          pageUrl,
          videoUrl: pageUrl,
          thumbnail: null,
          metadata: { title: `Video from ${extractDomain(pageUrl)}` },
          type: 'iframe',
          status: 'Direct Embed'
        };
        
      } catch (err) {
        throw new Error('Failed to process video URL');
      }
    }
    // Enhanced Special Platform Handling
    async function trySpecialPlatforms(pageUrl) {
      const url = new URL(pageUrl);
      
      if (url.hostname.includes('youtube.com') || url.hostname.includes('youtu.be')) {
        const videoId = extractYouTubeId(pageUrl);
        if (videoId) {
          const thumbnail = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
          const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=${autoPlay ? 1 : 0}&rel=0&modestbranding=1`;
          
          return {
            pageUrl,
            videoUrl: embedUrl,
            thumbnail,
            type: 'embed',
            status: 'YouTube Video',
            metadata: { title: 'YouTube Video', description: '' }
          };
        }
      }
      
      if (url.hostname.includes('vimeo.com')) {
        const videoId = pageUrl.match(/vimeo\.com\/(\d+)/);
        if (videoId) {
          const embedUrl = `https://player.vimeo.com/video/${videoId[1]}?autoplay=${autoPlay ? 1 : 0}`;
          
          return {
            pageUrl,
            videoUrl: embedUrl,
            thumbnail: null,
            type: 'embed',
            status: 'Vimeo Video',
            metadata: { title: 'Vimeo Video', description: '' }
          };
        }
      }
      
      return null;
    }
    // Utility Functions
    function extractDomain(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch (e) {
        return url;
      }
    }
    function extractYouTubeId(url) {
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(regex);
      return match ? match[1] : null;
    }
    function extractVideoFromHtml(html, baseUrl) {
      const extractors = [
        /<video[^>]*src=["']([^"'>]+)["']/gi,
        /<source[^>]*src=["']([^"'>]+)["']/gi,
        /https?:\/\/[^\s"'<>()]+\.(?:mp4|webm|ogg|m3u8)(?:\?[^\s"'<>()]*)?/gi
      ];
      for (const regex of extractors) {
        let match;
        while ((match = regex.exec(html)) !== null) {
          let videoUrl = match[1] || match[0];
          
          if (videoUrl && !videoUrl.startsWith('http')) {
            try {
              videoUrl = new URL(videoUrl, baseUrl).href;
            } catch (e) {
              continue;
            }
          }
          
          if (videoUrl && videoUrl.startsWith('http') && !videoUrl.includes('thumbnail')) {
            return videoUrl;
          }
        }
      }
      
      return null;
    }
    function extractThumbnailFromHtml(html, baseUrl) {
      const thumbnailRegexes = [
        /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"'>]+)["']/gi,
        /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"'>]+)["']/gi,
        /<video[^>]+poster=["']([^"'>]+)["']/gi
      ];
      for (const regex of thumbnailRegexes) {
        const match = regex.exec(html);
        if (match && match[1]) {
          let thumbnailUrl = match[1];
          
          if (!thumbnailUrl.startsWith('http')) {
            try {
              thumbnailUrl = new URL(thumbnailUrl, baseUrl).href;
            } catch (e) {
              continue;
            }
          }
          
          if (!thumbnailUrl.includes('logo') && !thumbnailUrl.includes('avatar')) {
            return thumbnailUrl;
          }
        }
      }
      
      return null;
    }
    function extractMetadataFromHtml(html) {
      try {
        const titleMatch = html.match(/<title[^>]*>([^<]+)<\/title>/i);
        const descMatch = html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"'>]+)["']/i);
        
        return {
          title: titleMatch ? titleMatch[1].substring(0, 100) : 'Video Content',
          description: descMatch ? descMatch[1].substring(0, 200) : ''
        };
      } catch (e) {
        return { title: 'Video Content', description: '' };
      }
    }
    // Error Handling
    function showError(title, message) {
      const videoContent = document.getElementById('videoContent');
      
      videoContent.innerHTML = `
        <div class="error-display">
          <div class="error-icon">⚠️</div>
          <div class="error-title">${title}</div>
          <div class="error-message">${message}</div>
          <div class="error-actions">
            <button class="nav-button" onclick="nextVideo()">Next Video</button>
            <button class="nav-button secondary" onclick="randomVideo()">Random Video</button>
            <button class="nav-button danger" onclick="exitFullscreen()">Go Home</button>
          </div>
        </div>
      `;
    }
    // Notification System
    function showNotification(message) {
      const notification = document.createElement('div');
      notification.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: var(--control-bg);
        color: white;
        padding: 1rem 2rem;
        border-radius: 1rem;
        font-weight: 600;
        z-index: 2000;
        animation: fadeInOut 3s ease-in-out forwards;
        backdrop-filter: blur(10px);
        border: 2px solid var(--control-border);
      `;
      notification.textContent = message;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        if (notification.parentNode) {
          notification.remove();
        }
      }, 3000);
    }
    // Load saved preferences
    function loadPreferences() {
      const savedAutoPlay = localStorage.getItem('autoPlay');
      
      if (savedAutoPlay !== null) {
        autoPlay = savedAutoPlay === 'true';
        const button = document.getElementById('autoplayButton');
        button.textContent = `⏯️ Auto: ${autoPlay ? 'ON' : 'OFF'}`;
        if (autoPlay) {
          button.classList.add('secondary');
        }
      }
    }
    // Optimized Initialization - Start with one random video
    (async function init() {
      loadPreferences();
      initializeKeyboardHandlers();
      
      // Start with one random video from ready URLs
      const randomIndex = Math.floor(Math.random() * readyUrls.length);
      allUrls = [readyUrls[randomIndex]];
      currentVideoIndex = 0;
      
      updateLoadingText('Loading first video...');
      updateProgress(10, 'Setting up player...');
      
      // Load the first random video immediately
      try {
        updateProgress(50, 'Loading video...');
        await loadCurrentVideo();
        updateProgress(100, 'Ready!');
        updateProgressDisplay();
      } catch (err) {
        console.error('Initial video load failed:', err);
        showError('Startup Error', 'Failed to load initial video. Please refresh the page.');
      }
      
      // Load full URL list in background after first video loads
      setTimeout(async () => {
        try {
          const rawListURL = 'https://raw.githubusercontent.com/application0/MyData/refs/heads/main/FindVideoInURLs';
          const res = await fetch(rawListURL);
          
          if (res.ok) {
            const text = await res.text();
            const newUrls = text.split(/\r?\n/).filter(u => u.trim() && /^https?:\/\//.test(u.trim()));
            
            if (newUrls.length > 0) {
              // Merge with ready URLs, but keep current video as first
              const currentUrl = allUrls[0];
              const uniqueUrls = [...new Set([currentUrl, ...newUrls])];
              
              // Shuffle the remaining URLs
              for (let i = uniqueUrls.length - 1; i > 1; i--) {
                const j = Math.floor(Math.random() * (i - 1)) + 1;
                [uniqueUrls[i], uniqueUrls[j]] = [uniqueUrls[j], uniqueUrls[i]];
              }
              
              allUrls = uniqueUrls;
              updateProgressDisplay();
              console.log(`Background loaded ${allUrls.length} total videos`);
            }
          }
        } catch (err) {
          console.warn('Background loading failed:', err);
        }
      }, 3000);
      
    })();
    // Prevent back navigation
    window.addEventListener('popstate', function(event) {
      exitFullscreen();
    });
  </script>
